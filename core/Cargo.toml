# FeatherKey — Rust core workspace.
#
# The full module map lives in SOFTWARE_ENGINEERING.md §5.2; the target registry
# is ARCHITECTURE.md §5.4. Crates are added to this workspace as they are
# implemented (TDD-first), so the `members` list below is the source of truth for
# what exists today. Waves 0–4 (MVP Rust core) are complete: the 17 crates below,
# including the `featherkey-core` composition façade (Wave 4; UniFFI surface
# authored FFI-ready, export scaffolding + bindgen deferred to Wave 5 per ADR-18).
# Not yet built (see the registry): gesture, clipboard-core (v1.x new modules),
# neural-runtime (v1.x), dictation (v2+), and the Android/Kotlin shell (Wave 5).
#
# Repository layout and per-crate anatomy: ARCHITECTURE.md §11 / §5.2 (ADR-17).
# Architecture rules (ARCHITECTURE.md §5, §6) are enforced by tools/fitness and CI.
[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/contracts",
    "crates/candidate-ranker",
    "crates/layout-engine",
    "crates/language-momentum",
    "crates/input-decoder",
    "crates/dictionary",
    "crates/secure-store",
    "crates/touch-model",
    "crates/sensitive-context",
    "crates/smart-typing",
    "crates/editing",
    "crates/diagnostics",
    "crates/crash-guard",
    "crates/personalization",
    "crates/locale-manager",
    "crates/prediction",
    "crates/autocorrect",
    "crates/featherkey-core",
    "crates/fold",
    "crates/context",
    "crates/corrections",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

# Deny-by-default lints for every crate in the workspace. The core is panic-averse
# (SEDD §5.5 rule 3: "errors are values, not panics"); unwrap/expect in library code
# is a lint, not a convention.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

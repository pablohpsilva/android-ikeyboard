[package]
name = "featherkey-core"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Composition façade: wires the core crates behind the contracts ports and presents the (UniFFI-ready) use-case API to the shell."

[package.metadata.featherkey]
layer = "composition"

[lib]
crate-type = ["lib", "cdylib"]

[features]
uniffi = ["dep:uniffi", "dep:thiserror"]

[dependencies]
uniffi = { version = "0.28", optional = true }
thiserror = { version = "2", optional = true }
featherkey-kernel = { path = "../kernel" }
featherkey-contracts = { path = "../contracts" }
featherkey-layout-engine = { path = "../layout-engine" }
featherkey-input-decoder = { path = "../input-decoder" }
featherkey-tap-sequence = { path = "../tap-sequence" }
featherkey-touch-model = { path = "../touch-model" }
featherkey-dictionary = { path = "../dictionary" }
featherkey-locale-manager = { path = "../locale-manager" }
featherkey-prediction = { path = "../prediction" }
featherkey-autocorrect = { path = "../autocorrect" }
featherkey-personalization = { path = "../personalization" }
featherkey-context = { path = "../context" }
featherkey-corrections = { path = "../corrections" }
featherkey-fold = { path = "../fold" }
featherkey-propercase = { path = "../propercase" }
featherkey-sensitive-context = { path = "../sensitive-context" }
featherkey-secure-store = { path = "../secure-store" }
featherkey-language-momentum = { path = "../language-momentum" }
featherkey-candidate-ranker = { path = "../candidate-ranker" }
featherkey-neural-ranker = { path = "../neural-ranker" }
featherkey-autocorrect-gate = { path = "../autocorrect-gate" }
featherkey-neural-tap = { path = "../neural-tap" }
featherkey-neural-lm = { path = "../neural-lm" }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

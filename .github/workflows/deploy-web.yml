# Deploy the marketing site (apps/web) to GitHub Pages.
#
# Uses the GitHub Actions Pages flow (not branch/docs), so the site can live in a
# subdirectory of the monorepo. The site is plain static files — no build step —
# so we just upload apps/web as the Pages artifact and deploy it.
#
# ONE-TIME SETUP (repo admin, in the GitHub UI):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that, every push to master touching apps/web redeploys automatically.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

# Least-privilege token: read the repo, write to Pages, mint the deploy OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload apps/web as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

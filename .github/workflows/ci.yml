# FeatherKey CI — the enforcement layer for ARCHITECTURE.md.
#
# The architecture's rules (SOLID boundaries, no god-files, 98% coverage, TDD)
# are only real if a red build blocks the merge. This workflow is that gate.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ARCH §7.3 / SEDD §12.5: minimum line+branch coverage on the core crates.
  MIN_COVERAGE: "98"

jobs:
  rust-core:
    name: Rust core — lint, test, coverage, fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy — library code (strict, no-panic invariant)
        # Library/bin code must be panic-averse: unwrap/expect/panic are denied
        # here (SEDD §5.5 r3). Runs on lib+bin targets only.
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Clippy — test code (real lints, but unwrap/expect allowed)
        # Tests legitimately unwrap/expect; still catch every other clippy lint.
        run: |
          cargo clippy --workspace --tests -- -D warnings \
            -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Architectural fitness functions
        # No-god-files, core purity, acyclic DAG, inward dependency rule
        # (ARCH §6/§3.2, SEDD §5.5, ADR-12).
        run: python3 tools/fitness/check.py

      - name: BDD traceability
        # Every Gherkin scenario is @BR-tagged and every tag references a real
        # requirement (SEDD BDD mandate). Specs cannot drift from the BRD.
        run: python3 tools/bdd_check.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage gate (line >= ${{ env.MIN_COVERAGE }}%)
        # ENFORCED gate: fails the build if line coverage on the core drops
        # below the bar (ARCH §7.3, SEDD §12.5). Runs on stable.
        run: |
          cargo llvm-cov --workspace \
            --fail-under-lines "${MIN_COVERAGE}" \
            --summary-only

      - name: Install nightly for branch coverage report
        # Branch coverage (-Z coverage-options=branch) is nightly-only.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Branch coverage report (informational)
        # NOT a hard gate. Branch coverage over Rust counts the untaken side of
        # every `assert!` condition in tests, so a strict branch threshold
        # punishes good tests. We surface the number for review; production-code
        # branches are expected at 100%.
        continue-on-error: true
        run: cargo +nightly llvm-cov --workspace --branch --summary-only

  supply-chain:
    name: Supply-chain hygiene (cargo-deny + audit, BR-65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny (advisories, bans, licenses, sources)
        # Config in deny.toml. Enforces permissive-only licenses, crates.io-only
        # sources, no yanked/advisory crates, no wildcard versions.
        run: cargo deny check
      - name: cargo-audit (RustSec advisory DB)
        # Needs a lockfile; the workspace gitignores Cargo.lock (libraries), so
        # generate one for the audit.
        run: |
          cargo generate-lockfile
          cargo audit

  android-shell:
    name: Android shell — assemble & unit test
    runs-on: ubuntu-latest
    # The Kotlin/Android modules under android/ are scaffolded but not yet
    # wired to a Gradle build in this repo. This job is defined so the pipeline
    # is complete; enable it once android/settings.gradle.kts resolves.
    if: ${{ hashFiles('android/gradlew') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble & test
        working-directory: android
        run: ./gradlew testDebugUnitTest lint

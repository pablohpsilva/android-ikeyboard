<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>FeatherKey — feature graphic 1024×500</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap');
:root{
  --ink-950:#17131C; --brand:#7A1F3D; --gold-500:#B8893B; --gold-400:#C9A45E;
  --gold-300:#DDBE85; --text-on-dark:#F4EFE6; --teal:#2FD3C6;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-sans:'Schibsted Grotesk',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#0d0a11;}
.stage{
  width:1024px;height:500px;position:relative;overflow:hidden;
  background:var(--ink-950);
  display:flex;align-items:center;gap:52px;
  padding:0 84px;
}
/* warm gold glow like the site hero */
.stage .glow{position:absolute;inset:0;
  background:
    radial-gradient(52% 78% at 22% 46%, rgba(47,211,198,.16), transparent 66%),
    radial-gradient(60% 90% at 82% 60%, rgba(184,137,59,.20), transparent 68%);
}
.stage .vignette{position:absolute;inset:0;
  background:radial-gradient(120% 130% at 50% 40%, transparent 55%, rgba(0,0,0,.45));}
.icon-wrap{position:relative;flex:0 0 auto;}
.icon-wrap img{width:236px;height:236px;border-radius:52px;display:block;
  box-shadow:0 34px 70px -22px rgba(0,0,0,.85), 0 0 0 1px rgba(184,137,59,.18);}
.copy{position:relative;max-width:560px;}
.wordmark{font-family:var(--font-display);font-weight:700;
  font-size:96px;line-height:.98;letter-spacing:-.01em;color:var(--text-on-dark);}
.wordmark .k{color:var(--gold-400);}
.rule{width:64px;height:3px;border-radius:2px;margin:22px 0 20px;
  background:linear-gradient(90deg,var(--teal),var(--gold-500));}
.tagline{font-family:var(--font-display);font-style:italic;font-weight:600;
  font-size:34px;line-height:1.12;color:rgba(244,239,230,.92);letter-spacing:.005em;}
.tagline em{font-style:italic;color:var(--gold-300);}
.sub{font-family:var(--font-sans);font-weight:500;font-size:18px;white-space:nowrap;
  color:rgba(244,239,230,.62);margin-top:16px;max-width:470px;}
</style></head><body>
